<!DOCTYPE html>
<html>
<head>
  <title>Skills Swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Skills Swap</h1>

  <input id="name" placeholder="Your Name">

  <h3>Skills You Have</h3>
  <input id="have" placeholder="e.g. Python, HTML">

  <h3>Skills You Want</h3>
  <input id="want" placeholder="e.g. Java, C++">

  <button id="addBtn">Add Profile</button>

  <h2>Matches</h2>
  <div id="matches"></div>

</div>

<script src="script.js"></script>

</body>
</html>
